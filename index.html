<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Stage Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #ffffff; overflow: hidden; }
        .tab-font { font-family: 'Fira Code', monospace; white-space: pre-wrap; }
        #tab-display-area { scroll-behavior: smooth; }
        .stage-view-active { background-color: #000 !important; padding: 2rem !important; font-size: 1.25rem !important; }
        #fullscreen-controls { transition: opacity 0.3s ease; opacity: 0; pointer-events: none; }
        .stage-view-active #fullscreen-controls { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="flex h-screen w-screen">
    <aside class="w-80 bg-neutral-900 border-r border-neutral-800 flex flex-col z-20 h-full">
        <div class="p-6 border-b border-neutral-800">
            <h1 class="text-2xl font-black text-white">STAGE<span class="text-blue-500">PRO</span></h1>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-2" id="song-list"></div>
        <div class="p-4 border-t border-neutral-800">
            <label class="flex flex-col items-center justify-center w-full h-12 border-2 border-neutral-700 border-dashed rounded-lg cursor-pointer bg-neutral-800">
                <span class="text-sm text-neutral-300">Upload songs.json</span>
                <input type="file" class="hidden" accept=".json" onchange="handleFileUpload(event)" />
            </label>
        </div>
    </aside>
    <main class="flex-1 flex flex-col bg-[#121212]">
        <header class="h-16 border-b border-neutral-800 flex items-center px-8 justify-between">
            <div id="instrument-toggle" class="flex space-x-1 p-1 bg-neutral-900 rounded-lg"></div>
            <button onclick="enterStageView()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg">STAGE VIEW</button>
        </header>
        <div id="tab-container" class="flex-1 overflow-hidden relative">
            <div id="fullscreen-controls" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-neutral-900/90 p-4 rounded-2xl flex items-center space-x-6 z-50">
                <button onclick="exitStageView()" class="text-white">Exit</button>
                <button onclick="toggleAutoScroll()" id="play-pause-btn" class="bg-blue-600 text-white rounded-full w-14 h-14">Play</button>
            </div>
            <div id="tab-display-area" class="h-full overflow-y-auto p-8">
                <h2 id="display-title" class="text-4xl font-black mb-2">Select a Song</h2>
                <div id="display-tab" class="tab-font text-lg text-neutral-200"></div>
            </div>
        </div>
    </main>
    <script>
        let database = [];
        let currentSong = null;
        let currentInstrument = 'bass';
        
        function handleFileUpload(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                database = JSON.parse(e.target.result);
                renderSidebar();
            };
            reader.readAsText(file);
        }

        function renderSidebar() {
            const list = document.getElementById('song-list');
            database.forEach(song => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-lg bg-neutral-800 text-neutral-400";
                btn.innerText = song.title;
                btn.onclick = () => { currentSong = song; updateDisplay(); };
                list.appendChild(btn);
            });
        }

        function updateDisplay() {
            document.getElementById('display-title').innerText = currentSong.title;
            document.getElementById('display-tab').innerText = currentSong.parts[currentInstrument]?.tab || "No data";
        }

        function enterStageView() { document.getElementById('tab-container').requestFullscreen(); document.getElementById('tab-display-area').classList.add('stage-view-active'); }
        function exitStageView() { document.exitFullscreen(); document.getElementById('tab-display-area').classList.remove('stage-view-active'); }
        function toggleAutoScroll() { /* Add scroll logic here */ }
    </script>
</body>
</html>
